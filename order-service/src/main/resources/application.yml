server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

camunda:
  bpm:
    enabled: true
    database:
      schema-update: true
    admin-user:
      id: admin
      password: adminpassword
      first-name: Admin
      last-name: User
      email: admin@foodsystem.com
    filter:
      create: All Tasks
